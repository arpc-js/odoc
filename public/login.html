<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>挂壁it课程</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            width: 380px;
            box-shadow: 0 12px 40px rgba(103, 58, 183, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 50px rgba(103, 58, 183, 0.5);
        }

        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #4527a0;
            margin-bottom: 30px;
            letter-spacing: 1.2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            height: 45px;
            padding-left: 40px;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-shadow: inset 0 0 8px rgba(101, 67, 185, 0.15);
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #7e57c2;
            box-shadow: 0 0 12px rgba(126, 87, 194, 0.6);
            outline: none;
        }

        .input-group .icon {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            color: #7e57c2;
            font-size: 18px;
        }

        .login-button {
            width: 100%;
            height: 45px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #42d392, #166534);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(66, 211, 146, 0.4);
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(66, 211, 146, 0.6);
        }

        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .login-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 400px) {
            .login-card {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="login-title">挂壁课程</h2>

    <div class="input-group">
        <i class="fas fa-user icon"></i>
        <input type="text" id="username" placeholder="用户名" autocomplete="username">
    </div>

    <div class="input-group">
        <i class="fas fa-lock icon"></i>
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    </div>

    <button class="login-button" id="loginBtn">登录</button>

    <div class="login-footer">
        © 2025 ARPC-ADMIN
    </div>
</div>

<script>
    const loginBtn = document.getElementById('loginBtn');

    loginBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            alert('用户名和密码不能为空');
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        try {
            const response = await fetch('/api/login', { // 替换为实际登录接口
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: username, pwd: password })
            });

            if (!response.ok) throw new Error('登录失败');

            const data = await response.json();
            localStorage.setItem('token', data.token);
            window.location.href = '/';
        } catch (err) {
            //alert(err.message);
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
            localStorage.setItem('token', '1');
            const params = new URLSearchParams(window.location.search)
            const redirect = params.get('redirect') || '/'
            window.location.href = redirect
        }
    });

    // 支持回车登录
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });
</script>
</body>
</html>
